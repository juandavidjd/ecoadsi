<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - Ecosistema ADSI</title>

  <!-- Tailwind CSS y Fuentes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #F8F9FA;
    }
    h1, h2 {
      font-family: 'Poppins', sans-serif;
    }
    .main-container {
      background: linear-gradient(135deg, #001f6a, #0046FF);
    }
  </style>
</head>
<body class="antialiased">

  <div class="main-container min-h-screen flex flex-col items-center justify-center text-white p-6">
    <div class="text-center bg-white/10 backdrop-blur-sm p-8 md:p-12 rounded-2xl shadow-lg max-w-lg w-full">
      
      <!-- Icono SVG de "Sin Conexión" -->
      <div class="mb-6">
        <svg class="w-20 h-20 mx-auto text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636M12 18.5a.5.5 0 01-1 0V5.5a.5.5 0 011 0v13zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" transform="rotate(90 12 12)"></line>
        </svg>
      </div>

      <h1 class="text-3xl md:text-4xl font-extrabold mb-4">Estás sin conexión</h1>
      <p class="text-lg opacity-90 mb-8">
        No hemos podido cargar esta página porque no tienes conexión a internet. Por favor, revisa tu red e inténtalo de nuevo.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="window.location.reload();" class="bg-cyan-400 text-gray-900 font-bold px-8 py-3 rounded-full hover:bg-cyan-300 transition-all duration-300 transform hover:scale-105">
          Intentar de nuevo
        </button>
        <a href="/index.html" class="bg-white/20 text-white font-bold px-8 py-3 rounded-full hover:bg-white/30 transition-all duration-300">
          Ir al inicio
        </a>
      </div>

    </div>
    <p class="mt-8 text-sm text-white/50">Ecosistema ADSI</p>
  </div>

</body>
</html>
