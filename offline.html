<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - Ecosistema ADSI</title>

  <!-- Tailwind CSS y Fuentes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#0046FF">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
    }
    .main-container {
      background: linear-gradient(135deg, #001f6a, #0046FF);
    }
  </style>
</head>
<body class="antialiased">

  <div class="main-container min-h-screen flex flex-col items-center justify-center text-white p-6 text-center">
    <div class="bg-white/10 backdrop-blur-sm p-8 md:p-12 rounded-2xl shadow-lg max-w-lg w-full">
      
      <!-- Icono de "Sin Conexión" -->
      <div class="mb-6">
        <svg class="w-20 h-20 mx-auto text-cyan-300" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>

      <h1 class="text-3xl md:text-4xl font-extrabold mb-4">Estás sin conexión</h1>
      <p class="text-lg opacity-90 mb-8">
        No pudimos cargar la página. Por favor, revisa tu conexión a internet e inténtalo de nuevo.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="window.location.reload();" class="bg-cyan-400 text-gray-900 font-bold px-8 py-3 rounded-full hover:bg-cyan-300 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-cyan-200">
          Reintentar
        </button>
        <a href="/ecoadsi/index.html" class="bg-white/20 text-white font-bold px-8 py-3 rounded-full hover:bg-white/30 transition-all duration-300">
          Ir a Inicio
        </a>
      </div>

    </div>
    <p class="mt-8 text-sm text-white/50">Ecosistema ADSI</p>
  </div>

</body>
</html>
